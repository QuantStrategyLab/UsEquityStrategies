version: 2
updates:
- package-ecosystem: "pip"
  directory: "/"
  schedule:
    interval: "weekly"
  open-pull-requests-limit: 5
  ignore:
  - dependency-name: "*"
    update-types:
    - "version-update:semver-major"
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
  open-pull-requests-limit: 5
  ignore:
  - dependency-name: "*"
    update-types:
    - "version-update:semver-major"
  - dependency-name: "QuantStrategyLab/QuantPlatformKit/.github/workflows/reusable-drift-check.yml"
