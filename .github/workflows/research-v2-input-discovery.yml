name: Research v2 Input Discovery

# Manual inventory remains the default. Exact mode reads one reviewed manifest
# revision in memory, never its referenced inputs; scope is bound before auth.
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [discovery, exact_manifest_metadata, runtime_parser_probe]
        default: discovery
      manifest_object:
        description: Exact mode canonical manifest object under the fixed input prefix
        type: string
        default: ''
      generation:
        description: Exact mode explicit archived generation
        type: string
        default: ''
      manifest_sha256:
        description: Exact mode reviewed lowercase manifest SHA256
        type: string
        default: ''
      max_manifest_bytes:
        description: Exact mode explicit byte limit, at most 1048576
        type: string
        default: ''
      config_sha256:
        description: Exact mode reviewed canonical run-config SHA256 including identity
        type: string
        default: ''

permissions:
  contents: read
  id-token: write

concurrency:
  group: research-v2-input-discovery
  cancel-in-progress: false

jobs:
  runtime_parser_probe:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.mode == 'runtime_parser_probe'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up existing Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Inspect parser import ordering without cloud access
        run: |
          set -euo pipefail
          sdk_root="$(gcloud info --format='value(installation.sdk_root)')"
          QSL_DISCOVERY_SDK_PATH="${sdk_root}/lib/third_party" timeout --signal=TERM --kill-after=5s 90s \
            python3 scripts/discover_research_v2_inputs.py --runtime-parser-probe | tee "$GITHUB_STEP_SUMMARY"

  discover:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.mode != 'runtime_parser_probe'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT: ${{ vars.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Validate exact read configuration
        run: |
          set -euo pipefail
          python3 scripts/discover_research_v2_inputs.py --workflow-inputs --preflight
      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - name: Discover bounded input metadata
        env:
          EXACT_AUTH_CREDENTIALS_FILE: ${{ steps.gcp-auth.outputs.credentials_file_path }}
        run: |
          set -euo pipefail
          sdk_root="$(gcloud info --format='value(installation.sdk_root)')"
          mode="$(python3 -c 'import json,os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"]))["inputs"].get("mode", "discovery"))')"
          if [ "$mode" = discovery ]; then
            QSL_DISCOVERY_SDK_PATH="${sdk_root}/lib/third_party" python3 scripts/discover_research_v2_inputs.py --workflow-inputs | tee "$GITHUB_STEP_SUMMARY"
          else
            # A socket idle timeout cannot bound slow-dribble streaming or auth.
            # The outer deadline bounds the entire exact-mode process, with kill grace.
            QSL_DISCOVERY_SDK_PATH="${sdk_root}/lib/third_party" timeout --signal=TERM --kill-after=5s 180s \
              python3 scripts/discover_research_v2_inputs.py --workflow-inputs | tee "$GITHUB_STEP_SUMMARY"
          fi
