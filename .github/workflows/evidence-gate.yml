name: Evidence Gate

# Block PRs that promote catalog status without a valid evidence package.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/**/catalog.py"
      - "src/**/combo_manifests.py"
      - "docs/evidence/**"
      - "evidence/**"

permissions:
  contents: read
  pull-requests: read
  id-token: write

concurrency:
  group: evidence-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve QuantPlatformKit ref
        id: quant-platform-kit-ref
        run: |
          set -euo pipefail
          ref="$(python3 - <<'PYTHON'
          import re, tomllib
          with open("pyproject.toml", "rb") as stream:
              deps = tomllib.load(stream)["project"]["dependencies"]
          matches = [re.fullmatch(r"quant-platform-kit @ git\+https://github.com/QuantStrategyLab/QuantPlatformKit\.git@([0-9a-f]{40})", dep) for dep in deps]
          pins = [match.group(1) for match in matches if match]
          if len(pins) != 1:
              raise SystemExit("exact consumer QPK pin required")
          print(pins[0])
          PYTHON
          )"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: Checkout QuantPlatformKit
        uses: actions/checkout@v6
        with:
          repository: QuantStrategyLab/QuantPlatformKit
          ref: ${{ steps.quant-platform-kit-ref.outputs.ref }}
          path: external/QuantPlatformKit

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e . pandas
          python -m pip check

      - name: Evaluate Evidence Gate
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          AI_SERVICE_URL: ${{ vars.AI_SERVICE_URL }}
          AI_SERVICE_AUDIENCE: ${{ vars.AI_SERVICE_AUDIENCE }}
          AI_SERVICE_REVIEWERS_JSON: ${{ vars.AI_SERVICE_REVIEWERS_JSON }}
        run: python scripts/gate_evidence_package.py
