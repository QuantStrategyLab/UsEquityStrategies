name: Batch A v2 Cloud Materialization

# Read-only R1 materialization + C3 comparison against a locked v2 GCS prefix.
# Does not collect, upload, delete, call brokers/AI, deploy, or write GitHub APIs.

on:
  workflow_dispatch:
    inputs:
      gcs_input_prefix:
        description: "Exact GCS input prefix gs://qsl-research-evidence-831478360303/research/v2/input/<dataset_id>"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: batch-a-v2-cloud-materialization
  cancel-in-progress: false

jobs:
  materialize-and-compare:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Validate GCS input prefix
        id: validate-prefix
        env:
          GCS_INPUT_PREFIX: ${{ inputs.gcs_input_prefix }}
        run: |
          set -euo pipefail
          prefix="${GCS_INPUT_PREFIX%/}"
          summary_path="${RUNNER_TEMP}/batch-a-v2-materialize-compare.json"
          # Exactly one dataset id segment; reject path traversal and multi-segment prefixes.
          allowed='^gs://qsl-research-evidence-831478360303/research/v2/input/[A-Za-z0-9][A-Za-z0-9._-]{0,62}$'
          if [[ ! "$prefix" =~ $allowed ]]; then
            python - <<'PY' | tee "${summary_path}" | tee -a "${GITHUB_STEP_SUMMARY}"
          import json
          print(
              json.dumps(
                  {
                      "status": "PARKED",
                      "reason_code": "GCS_INPUT_PREFIX_REJECTED",
                      "execution_authorized": False,
                      "no_order": True,
                  },
                  sort_keys=True,
                  separators=(",", ":"),
              )
          )
          PY
            exit 2
          fi
          echo "gcs_input_prefix=${prefix}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Stage, materialize, and compare (sanitized JSON only)
        env:
          GCS_INPUT_PREFIX: ${{ steps.validate-prefix.outputs.gcs_input_prefix }}
        run: |
          set -euo pipefail
          pack_path="${RUNNER_TEMP}/batch-a-v2-member-pack.json"
          summary_path="${RUNNER_TEMP}/batch-a-v2-materialize-compare.json"
          set +e
          materialize_out="$(
            python scripts/run_batch_a_from_gcs.py \
              --gcs-input-prefix "${GCS_INPUT_PREFIX}" \
              --pack-output "${pack_path}"
          )"
          materialize_rc=$?
          set -e
          if [[ "${materialize_rc}" -ne 0 || ! -f "${pack_path}" ]]; then
            printf '%s\n' "${materialize_out}" \
              | tee "${summary_path}" \
              | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 2
          fi
          set +e
          compare_out="$(
            python scripts/run_c3_batch_a_existing_member_baseline.py \
              --frozen-member-pack "${pack_path}"
          )"
          compare_rc=$?
          set -e
          printf '%s\n' "${compare_out}" \
            | tee "${summary_path}" \
            | tee -a "${GITHUB_STEP_SUMMARY}"
          exit "${compare_rc}"
