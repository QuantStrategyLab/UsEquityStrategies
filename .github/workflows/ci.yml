name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e . numpy pandas pandas_market_calendars pytz pytest pytest-cov ruff==0.15.22
          python -m pip check

      - name: Verify research QPK revision and ledger contract
        run: |
          python - <<'PY'
          import json
          from importlib.metadata import distribution

          from quant_platform_kit.strategy_lifecycle.contracts import ResearchLedgerEvent

          expected = "62bcd5f6d5e236c315a7383ddf7b35e2aac30b62"
          provenance = json.loads(distribution("quant-platform-kit").read_text("direct_url.json"))
          if provenance.get("vcs_info", {}).get("commit_id") != expected:
              raise SystemExit("quant-platform-kit: installed revision differs from research pin")
          print(f"quant-platform-kit: {expected}; ResearchLedgerEvent: {ResearchLedgerEvent.__name__}")
          PY

      - name: Run Ruff
        run: |
          set -euo pipefail
          ruff check .

      - name: Run unit tests
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m pytest -q tests --cov --cov-report=term --cov-report=xml
