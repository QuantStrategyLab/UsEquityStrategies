name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[research]' numpy pandas pandas_market_calendars pytz pytest pytest-cov ruff==0.15.22
          python -m pip check

      - name: Verify research dependency commits
        run: |
          python - <<'PY'
          import json
          from importlib.metadata import distribution
          from quant_platform_kit.strategy_lifecycle.contracts import ResearchLedgerEvent

          expected = {
              "quant-platform-kit": "f6f2079f6b53d3cbb3b72bdcc5c2476ed8f170f1",
              "quant-strategy-plugins": "3416da47580be1537183e378f3ca9efacc6f9b8c",
          }
          for name, sha in expected.items():
              provenance = json.loads(distribution(name).read_text("direct_url.json"))
              if provenance.get("vcs_info", {}).get("commit_id") != sha:
                  raise SystemExit(f"{name}: installed revision differs from research pin")
              print(f"{name}: {sha}")
          print(f"ResearchLedgerEvent: {ResearchLedgerEvent.__name__}")
          PY

      - name: Run Ruff
        run: |
          set -euo pipefail
          ruff check .

      - name: Run unit tests
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m pytest -q tests --cov --cov-report=term --cov-report=xml

  research-stats-integration:
    # Research-only integration for us_equity_strategies.research.trial_overfitting_report
    # and fractional_kelly_walk_forward (RS-04).
    # This job alone overlays a newer QPK that provides quant_platform_kit.research_stats.
    # The package pin in pyproject.toml / qsl.toml is NOT changed; production installs
    # and the main test job keep the pinned QPK revision.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QPK_RESEARCH_STATS_SHA: 442b729dcc4be5100bc2cba5b67850ad676bfbc0
      UES_REQUIRE_QPK_RESEARCH_STATS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install with research-only QPK overlay
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[research]' numpy pandas pandas_market_calendars pytz pytest jsonschema
          # QPK declares no runtime dependencies, so this dependency-enabled reinstall
          # only swaps the QPK revision inside this job.
          python -m pip install --force-reinstall \
            "quant-platform-kit @ git+https://github.com/QuantStrategyLab/QuantPlatformKit.git@${QPK_RESEARCH_STATS_SHA}"
          python - <<'PY'
          import json, os
          from importlib.metadata import distribution
          from quant_platform_kit.research_stats import probability_of_backtest_overfitting, deflated_sharpe_ratio
          sha = json.loads(distribution("quant-platform-kit").read_text("direct_url.json"))["vcs_info"]["commit_id"]
          assert sha == os.environ["QPK_RESEARCH_STATS_SHA"], sha
          print("research-only QPK overlay:", sha)
          PY

      - name: Run research_stats integration tests
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m pytest -q -rs tests/research/test_trial_overfitting_report.py tests/research/test_fractional_kelly_walk_forward.py tests/test_research_import_boundary.py
