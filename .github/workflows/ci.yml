name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[research]' numpy pandas pandas_market_calendars pytz pytest pytest-cov ruff==0.15.22
          python -m pip check

      - name: Verify research dependency commits
        run: |
          python - <<'PY'
          import json
          from importlib.metadata import distribution
          from quant_platform_kit.strategy_lifecycle.contracts import ResearchLedgerEvent

          expected = {
              "quant-platform-kit": "f6f2079f6b53d3cbb3b72bdcc5c2476ed8f170f1",
              "quant-strategy-plugins": "3416da47580be1537183e378f3ca9efacc6f9b8c",
          }
          for name, sha in expected.items():
              provenance = json.loads(distribution(name).read_text("direct_url.json"))
              if provenance.get("vcs_info", {}).get("commit_id") != sha:
                  raise SystemExit(f"{name}: installed revision differs from research pin")
              print(f"{name}: {sha}")
          print(f"ResearchLedgerEvent: {ResearchLedgerEvent.__name__}")
          PY

      - name: Run Ruff
        run: |
          set -euo pipefail
          ruff check .

      - name: Run unit tests
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m pytest -q tests --cov --cov-report=term --cov-report=xml

  research-stats-integration:
    # Research-only integration for us_equity_strategies.research.trial_overfitting_report
    # and fractional_kelly_walk_forward (RS-04).
    # This job alone overlays a newer QPK that provides quant_platform_kit.research_stats.
    # The package pin in pyproject.toml / qsl.toml is NOT changed; production installs
    # and the main test job keep the pinned QPK revision.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QPK_RESEARCH_STATS_SHA: dd17abbddac9aa5983c19905e415bcb7d71f7962
      UES_REQUIRE_QPK_RESEARCH_STATS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install with research-only QPK overlay
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[research]' numpy pandas pandas_market_calendars pytz pytest jsonschema
          # QPK declares no runtime dependencies, so this dependency-enabled reinstall
          # only swaps the QPK revision inside this job.
          python -m pip install --force-reinstall \
            "quant-platform-kit @ git+https://github.com/QuantStrategyLab/QuantPlatformKit.git@${QPK_RESEARCH_STATS_SHA}"
          python - <<'PY'
          import json, os
          from importlib.metadata import distribution
          from quant_platform_kit.research_stats import probability_of_backtest_overfitting, deflated_sharpe_ratio
          sha = json.loads(distribution("quant-platform-kit").read_text("direct_url.json"))["vcs_info"]["commit_id"]
          assert sha == os.environ["QPK_RESEARCH_STATS_SHA"], sha
          print("research-only QPK overlay:", sha)
          PY

      - name: Run research_stats integration tests
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m pytest -q -rs tests/research/test_trial_overfitting_report.py tests/research/test_fractional_kelly_walk_forward.py tests/research/test_fractional_kelly_preregistration.py tests/research/test_kelly_core_return_generator.py tests/research/test_portfolio_kelly_preregistration.py tests/research/test_portfolio_kelly_walk_forward.py tests/research/test_rs07_parity.py tests/test_research_import_boundary.py

  research-execution-integration:
    # Test A2 against an immutable research-only QPK overlay. Production pins
    # and the existing statistics integration environment remain unchanged.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QPK_EXECUTION_MODELS_SHA: 5c0693c8735f5ed04c8943ab1fab00c82496b22c
      UES_REQUIRE_QPK_EXECUTION_MODELS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install research-only execution overlay
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          python -m pip install --force-reinstall \
            "quant-platform-kit @ git+https://github.com/QuantStrategyLab/QuantPlatformKit.git@${QPK_EXECUTION_MODELS_SHA}"
          python - <<'PY'
          import json, os
          from importlib.metadata import distribution
          from quant_platform_kit.research_stats.execution_models import CostModel, FillModel
          installed = json.loads(distribution("quant-platform-kit").read_text("direct_url.json"))
          sha = installed["vcs_info"]["commit_id"]
          assert sha == os.environ["QPK_EXECUTION_MODELS_SHA"], sha
          print("research-only execution QPK overlay:", sha)
          PY

      - name: Run required execution adapter acceptance
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m pytest -q -rs tests/research/test_execution_model_adapter.py --junitxml=execution-model-tests.xml
          PYTHONPATH=src python -m pytest -q -rs tests/research/test_kelly_core_return_generator.py -k close_fill --junitxml=close-fill-measurement-tests.xml
          PYTHONPATH=src python -m pytest -q -rs tests/research/test_b1_b2_rs04_synthetic_acceptance.py -k "not qpk_measurement_nulls" --junitxml=b1-b2-preparation-tests.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          for filename in ("execution-model-tests.xml", "close-fill-measurement-tests.xml", "b1-b2-preparation-tests.xml"):
              root = ET.parse(filename).getroot()
              assert list(root.iter("testcase")), f"required execution tests missing: {filename}"
              skipped = sum(int(suite.attrib.get("skipped", 0)) for suite in root.iter("testsuite"))
              assert skipped == 0, f"required execution tests skipped: {filename}: {skipped}"
          PY

  research-security-netting-consumer:
    # Synthetic ledger and compounding only. This isolated QPK merge has the
    # reviewed source tree; production pins and all other research jobs keep
    # their identities. No research data or cloud job dispatch.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QPK_SECURITY_NETTING_SHA: 7840127862ea715e44c8f70b03155a399dc817de
      UES_REQUIRE_SECURITY_NETTING: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install isolated security-netting overlay
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          python -m pip install --force-reinstall \
            "quant-platform-kit @ git+https://github.com/QuantStrategyLab/QuantPlatformKit.git@${QPK_SECURITY_NETTING_SHA}"
          python -m pip check
          python - <<'PY'
          import json, os
          from inspect import signature
          from importlib.metadata import distribution
          from quant_platform_kit.research_stats.security_netting import SECURITY_NETTING_VERSION
          from quant_platform_kit.research_stats.unified_report import build_unified_net_report
          installed = json.loads(distribution("quant-platform-kit").read_text("direct_url.json"))
          assert installed["vcs_info"]["commit_id"] == os.environ["QPK_SECURITY_NETTING_SHA"]
          assert SECURITY_NETTING_VERSION == "security_level_netting_v1"
          assert "periods_per_year" in signature(build_unified_net_report).parameters
          report = build_unified_net_report([0.0], periods_per_year=1)
          assert report.metric("net_cagr").details["definition_version"] == "qpk.net_compounding.v1"
          assert report.metric("net_calmar_ratio").reason_code == "zero_drawdown"
          print("Immutable research-only netting and compounding overlay verified.")
          PY

      - name: Run synthetic ledger, compounding and runtime-boundary acceptance
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m pytest -q -rs \
            tests/research/test_security_netting_runner.py \
            tests/research/test_security_netting_compounding_report.py \
            tests/research/test_security_netting_rs06_reconciliation.py \
            tests/research/test_portfolio_netting_candidate_closed_loop.py \
            tests/test_research_import_boundary.py --junitxml=security-netting-tests.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("security-netting-tests.xml").getroot()
          cases = list(root.iter("testcase"))
          assert any("cash_funded_hand_math_and_fee_feedback" in c.attrib["name"] for c in cases)
          assert any("seeded_sessions_reconcile_with_fee_feedback" in c.attrib["name"] for c in cases)
          assert len([c for c in cases if c.attrib["classname"].endswith("test_security_netting_compounding_report")]) >= 18
          assert any("rs06_zero_cost_aligned_targets" in c.attrib["name"] for c in cases)
          assert any("rs06_cost_model_difference" in c.attrib["name"] for c in cases)
          candidate_cases = [c for c in cases if c.attrib["classname"].endswith("test_portfolio_netting_candidate_closed_loop")]
          assert candidate_cases, "RS06 candidate target was not collected"
          for required in ("success_actual_fee_cash", "success_conservation_public_metrics",
                           "unknown_write_success_response_lost", "recovery_missing_or_tampered",
                           "recovery_identity_mismatch", "reject_fee_cash_insufficient",
                           "default_off_structure", "zero_drawdown_and_uncomputable",
                           "r2_fee_cashflow_counterexample", "r2_recovery_returns_entire",
                           "r2_all_record_and_receipt_content_bound", "r2_receipt_payload_tamper",
                           "r2_receipt_ack_and_terminal_order", "r2_receipt_exclusive_create",
                           "r3_all_existing_store_links", "r2_followup_rehashed_receipt",
                           "r2_followup_normal_recovery", "r2_followup_book_fields"):
              assert any(required in c.attrib["name"] for c in candidate_cases), required
          assert not any(list(c.iter(tag)) for c in candidate_cases for tag in ("skipped", "failure", "error"))
          assert not any(list(root.iter(tag)) for tag in ("skipped", "failure", "error"))
          print("Synthetic ledger, compounding and RS06 reconciliation executed without skips or failures.")
          PY

  research-unified-net-consumer:
    # Explicit CLI/report acceptance only. Existing production pins and both
    # other research overlay environments keep their prior identities.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QPK_UNIFIED_NET_REPORT_SHA: b6b51d5c32594c47cc1b3ebc0c1ed226e9db887f
      UES_REQUIRE_UNIFIED_NET_REPORT: "1"
      UES_REQUIRE_NET_PATH_DIAGNOSTICS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install isolated latest report overlay
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pandas_market_calendars
          python -m pip install --force-reinstall \
            "quant-platform-kit @ git+https://github.com/QuantStrategyLab/QuantPlatformKit.git@${QPK_UNIFIED_NET_REPORT_SHA}"
          python -m pip check
          python - <<'PY'
          import inspect, json, os
          from importlib.metadata import distribution
          from quant_platform_kit.research_stats.unified_report import build_unified_net_report
          from quant_platform_kit.research_stats.net_path_diagnostics import build_net_path_diagnostics
          installed = json.loads(distribution("quant-platform-kit").read_text("direct_url.json"))
          assert installed["vcs_info"]["commit_id"] == os.environ["QPK_UNIFIED_NET_REPORT_SHA"]
          assert "include_outcome_diagnostics" in inspect.signature(build_unified_net_report).parameters
          report = build_unified_net_report([-.1, 0.0, .2], include_outcome_diagnostics=True)
          assert len(report.metrics) == 12 and report.no_order is True
          path = build_net_path_diagnostics([-.5, 0.0, 1.0])
          assert path.metric("longest_recovered_drawdown_duration_observations").value == 3
          assert path.no_order is True and path.live_ready is False
          print("Required latest unified/outcome report capability and immutable source verified.")
          PY

      - name: Run required actual CLI and report acceptance
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m pytest -q -rs \
            tests/test_c3_batch_a_existing_member_baseline.py \
            --junitxml=unified-net-consumer-tests.xml
          PYTHONPATH=src python -m pytest -q -rs \
            tests/research/test_b1_b2_rs04_synthetic_acceptance.py -k qpk_measurement_nulls
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("unified-net-consumer-tests.xml").getroot()
          cases = list(root.iter("testcase"))
          assert cases and any("unified_cli_uses_actual_selected_net_returns" in c.attrib["name"] for c in cases)
          assert any("unified_hand_math" in c.attrib["name"] for c in cases)
          assert any("net_path_actual_cli_31_books" in c.attrib["name"] for c in cases)
          assert any("net_path_hand_math_and_censoring" in c.attrib["name"] for c in cases)
          assert not any(list(root.iter(tag)) for tag in ("skipped", "failure", "error"))
          print("Actual CLI chain and positive hand-math tests executed with no skipped/failed cases.")
          PY
