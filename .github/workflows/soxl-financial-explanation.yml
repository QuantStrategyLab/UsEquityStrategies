name: SOXL Frozen Financial Explanation
on:
  workflow_dispatch:
    inputs:
      execute:
        description: Explain the approved frozen experiment without model calls
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: soxl-financial-explanation
  cancel-in-progress: false
jobs:
  explain:
    if: github.repository == 'QuantStrategyLab/UsEquityStrategies' && github.ref == 'refs/heads/main' && vars.AI_SERVICE_RELEASE_READY == 'true' && vars.HOSTED_RESEARCH_ACCEPTED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Stage the approved hosted input bundle
        env:
          GH_TOKEN: ${{ github.token }}
          HOSTED_INPUT_RELEASE: ${{ vars.HOSTED_INPUT_RELEASE }}
          HOSTED_INPUT_ASSET: ${{ vars.HOSTED_INPUT_ASSET }}
          HOSTED_INPUT_SHA256: ${{ vars.HOSTED_INPUT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$HOSTED_INPUT_RELEASE" && test -n "$HOSTED_INPUT_ASSET"
          [[ "$HOSTED_INPUT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$HOSTED_INPUT_ASSET" =~ ^[A-Za-z0-9_.-]+\.zip$ ]]
          gh release download "$HOSTED_INPUT_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern "$HOSTED_INPUT_ASSET" --dir "$RUNNER_TEMP/approved-input"
          python - <<'PYCODE'
          import hashlib, os, stat, zipfile
          from pathlib import Path, PurePosixPath
          archive = Path(os.environ['RUNNER_TEMP']) / 'approved-input' / os.environ['HOSTED_INPUT_ASSET']
          if hashlib.sha256(archive.read_bytes()).hexdigest() != os.environ['HOSTED_INPUT_SHA256']:
              raise SystemExit('approved hosted input digest mismatch')
          target = Path('hosted-inputs')
          with zipfile.ZipFile(archive) as bundle:
              entries = bundle.infolist()
              if len(entries) > 100000 or sum(item.file_size for item in entries) > 8 * 1024**3:
                  raise SystemExit('hosted input bundle exceeds the staging limit')
              for item in entries:
                  path = PurePosixPath(item.filename)
                  if path.is_absolute() or '..' in path.parts or '\' in item.filename or stat.S_ISLNK(item.external_attr >> 16):
                      raise SystemExit('unsafe hosted input bundle entry')
              bundle.extractall(target)
          PYCODE
      - name: Show the frozen interface
        if: inputs.execute != true
        run: python scripts/soxl_financial_explanation.py --help
      - name: Explain the frozen experiment
        if: inputs.execute == true
        env:
          P1_ROOT: ${{ vars.SOXL_P1_ROOT }}
          UES_SOURCE: ${{ vars.SOXL_FINANCIAL_UES_SOURCE_ROOT }}
          QPK_SOURCE: ${{ vars.SOXL_FINANCIAL_QPK_SOURCE_ROOT }}
          RUN_ROOT: ${{ vars.SOXL_FINANCIAL_RUN_ROOT }}
        run: |
          set -euo pipefail
          test -n "$P1_ROOT" && test -n "$UES_SOURCE" && test -n "$QPK_SOURCE" && test -n "$RUN_ROOT"
          python scripts/soxl_financial_explanation.py --p1-root "$P1_ROOT" --ues-repo-root "$UES_SOURCE" --qpk-repo-root "$QPK_SOURCE" --run-root "$RUN_ROOT"
