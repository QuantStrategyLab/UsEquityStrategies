name: SOXL Bounded Research V2
on:
  workflow_dispatch:
    inputs:
      codegen:
        description: Request a bounded candidate patch before frozen research
        type: boolean
        default: false
      execute:
        description: Execute approved cloud research
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: soxl-research-v2
  cancel-in-progress: false
jobs:
  research:
    if: github.repository == 'QuantStrategyLab/UsEquityStrategies' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && vars.AI_SERVICE_RELEASE_READY == 'true' && vars.HOSTED_RESEARCH_ACCEPTED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AI_SERVICE_URL: ${{ vars.AI_SERVICE_URL }}
      AI_SERVICE_AUDIENCE: ${{ vars.AI_SERVICE_AUDIENCE }}
      AI_SERVICE_MODE: agent
      AI_SERVICE_MODEL: ${{ vars.AI_SERVICE_RESEARCH_MODEL }}
      AI_SERVICE_PROFILE: ${{ vars.AI_SERVICE_RESEARCH_PROFILE || 'default' }}
      AI_SERVICE_CLIENT_WHEEL: ${{ vars.AI_SERVICE_CLIENT_WHEEL }}
      AI_SERVICE_CLIENT_SHA256: ${{ vars.AI_SERVICE_CLIENT_SHA256 }}
      AI_SERVICE_QPK_WHEEL: ${{ vars.AI_SERVICE_QPK_WHEEL }}
      AI_SERVICE_QPK_SHA256: ${{ vars.AI_SERVICE_QPK_SHA256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Stage the approved hosted input bundle
        env:
          GH_TOKEN: ${{ github.token }}
          HOSTED_INPUT_RELEASE: ${{ vars.HOSTED_INPUT_RELEASE }}
          HOSTED_INPUT_ASSET: ${{ vars.HOSTED_INPUT_ASSET }}
          HOSTED_INPUT_SHA256: ${{ vars.HOSTED_INPUT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$HOSTED_INPUT_RELEASE" && test -n "$HOSTED_INPUT_ASSET"
          [[ "$HOSTED_INPUT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$HOSTED_INPUT_ASSET" =~ ^[A-Za-z0-9_.-]+\.zip$ ]]
          gh release download "$HOSTED_INPUT_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern "$HOSTED_INPUT_ASSET" --dir "$RUNNER_TEMP/approved-input"
          python - <<'PYCODE'
          import hashlib, os, stat, zipfile
          from pathlib import Path, PurePosixPath
          archive = Path(os.environ['RUNNER_TEMP']) / 'approved-input' / os.environ['HOSTED_INPUT_ASSET']
          if hashlib.sha256(archive.read_bytes()).hexdigest() != os.environ['HOSTED_INPUT_SHA256']:
              raise SystemExit('approved hosted input digest mismatch')
          target = Path('hosted-inputs')
          with zipfile.ZipFile(archive) as bundle:
              entries = bundle.infolist()
              if len(entries) > 100000 or sum(item.file_size for item in entries) > 8 * 1024**3:
                  raise SystemExit('hosted input bundle exceeds the staging limit')
              for item in entries:
                  path = PurePosixPath(item.filename)
                  if path.is_absolute() or '..' in path.parts or '\' in item.filename or stat.S_ISLNK(item.external_attr >> 16):
                      raise SystemExit('unsafe hosted input bundle entry')
              bundle.extractall(target)
          PYCODE
      - name: Install reviewed task runtime and owner source
        run: |
          python -m pip install .
          python -m pip install --no-index --find-links hosted-inputs/wheels -r hosted-inputs/runtime-requirements.txt
          python scripts/install_ai_task_client.py
          python -m pip check
      - name: Show the bounded interface
        if: inputs.execute != true
        run: python -m us_equity_strategies.research.soxl_new_research --help
      - name: Run bounded research
        if: inputs.execute == true
        env:
          P1_ROOT: ${{ vars.SOXL_P1_ROOT }}
          APPROVED_SOURCE: ${{ vars.SOXL_APPROVED_SOURCE_ROOT }}
          RUN_ROOT: ${{ vars.SOXL_RESEARCH_RUN_ROOT }}
          CODEGEN: ${{ inputs.codegen }}
        run: |
          set -euo pipefail
          test -n "$P1_ROOT" && test -n "$APPROVED_SOURCE" && test -n "$RUN_ROOT"
          args=(--soxl-rsi2-controlled)
          if [[ "$CODEGEN" == "true" ]]; then args=(--soxl-rsi2-codegen); docker info --format '{{.ServerVersion}}'; fi
          python -m us_equity_strategies.research.soxl_new_research "${args[@]}" --p1-root "$P1_ROOT" --ues-repo-root "$APPROVED_SOURCE" --run-root "$RUN_ROOT" --output "$RUNNER_TEMP/soxl-research-v2.json"
