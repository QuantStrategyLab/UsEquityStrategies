name: RS-04 B3 research qualification
run-name: RS-04 B3 research (execute=${{ inputs.execute }})

# Manual, cloud-only, existing WIF and input roots. No provider secrets or data
# acquisition; no live/shadow permissions. Full rule callback is implemented;
# qualification still stops on absent effective config/context/parity evidence.
on:
  workflow_dispatch:
    inputs:
      execute:
        description: Attempt cloud input qualification; park on missing live baseline
        type: boolean
        default: false
      archive_prefix:
        description: Exact approved RS-04 GCS archive prefix; never a substitute dataset
        type: string
        default: ''

permissions:
  contents: read
  id-token: write

concurrency:
  group: rs04-b3-research
  cancel-in-progress: false

jobs:
  research:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout frozen research source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install research test runtime
        run: python -m pip install -e . pytest
      - name: Synthetic code and causal tests before any cloud input
        id: synthetic
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m pytest -q tests/research/test_rs04_b3.py tests/research/test_rs04_b3_cloud.py tests/research/test_rs04_b3_live_replay.py tests/test_research_import_boundary.py
          PYTHONPATH=src python scripts/run_rs04_b3_research.py --synthetic --output "$RUNNER_TEMP/rs04-b3-synthetic.json"
      - name: Authenticate with existing research WIF
        id: auth
        if: inputs.execute == true && steps.synthetic.outcome == 'success'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - name: Setup existing Cloud SDK
        if: inputs.execute == true && steps.auth.outcome == 'success'
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - name: Qualify source and baseline; preserve missing evidence
        if: always()
        env:
          EXECUTE: ${{ inputs.execute }}
          RS04_AUTH_OUTCOME: ${{ steps.auth.outcome }}
          RS04_SYNTHETIC_OUTCOME: ${{ steps.synthetic.outcome }}
          RS04_ARCHIVE_PREFIX: ${{ inputs.archive_prefix }}
          UX1_RAW_GCS_PREFIX: ${{ vars.UX1_RAW_GCS_PREFIX }}
          UX1_R6_GCS_PREFIX: ${{ vars.UX1_R6_GCS_PREFIX }}
        run: |
          set -euo pipefail
          args=(--cloud-preflight)
          if [[ "$EXECUTE" == true ]]; then args+=(--execute); fi
          PYTHONPATH=src python scripts/run_rs04_b3_research.py "${args[@]}" --output "$RUNNER_TEMP/rs04-b3-aggregate.json"
      - name: Upload aggregate report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rs04-b3-aggregate
          path: ${{ runner.temp }}/rs04-b3-aggregate.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish sanitized status
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'rs04-b3-aggregate.json'
          if path.is_file():
              r = json.loads(path.read_text())
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                  f.write('RS-04 B3: ' + r['status'] + '\n\n')
                  f.write('Acceptance: ' + r['acceptance'] + '; shadow recommendation: no.\n\n')
                  f.write('\n'.join('- ' + b for b in r['blockers']) + '\n')
          PY
